[project]
name = "tekmor"
version = "0.1.0"
description = "本地优先、端到端可验证的 RAG 知识库与证据锚定平台 (确证/凭证)"
authors = [{ name = "晨星" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sse-starlette==3.4.11",
    "pydantic==2.13.5",
    "onnxruntime==1.30.0",
    "numpy==2.5.3",
    "tokenizers==0.23.2",
    "sqlite-vec==0.1.9",
    "opentelemetry-sdk==1.44.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.1.1"]

[project.scripts]
tekmor = "tekmor.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekmor"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
